[SystemSettings]
; Rival bot RNG seed. 0 = random per race, which is the shipping behaviour.
;
; Set this to any non-zero value to make a race REPEATABLE, then run the same
; number twice: the rival's difficulty jitter, its boost engage threshold and
; traffic's lane-change draws are all pinned, so any telemetry difference between
; the two runs is the change under test rather than the dice. Without it, the
; +/-0.10 jitter on BoostEngageCharge alone moves when the rival arms boost, and
; cross-run comparisons on this bot were previously reported with more confidence
; than that noise floor supported.
;
; Editing this line is equivalent to typing `overlane.Bot.Seed <n>` in the console,
; and it survives a restart, which the console value does not.
overlane.Bot.Seed=0
